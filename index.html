<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meta Display Image</title>
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Renders a single 600 x 600 image">
  <meta name="mrbd-web-app-capable" content="yes">
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    body { width: 600px; height: 600px; overflow: hidden; }
    img { display: block; width: 600px; height: 600px; }
  </style>
</head>
<body>
  <img src="bigstairs_2_green.png" width="600" height="600" alt="">
  <script>
    // Experimental: keep the display on. Support on Meta Ray-Ban Display is undocumented.
    async function keepAwake() {
      try { await navigator.wakeLock.request('screen'); } catch (e) { /* unsupported or denied */ }
    }
    keepAwake();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepAwake();
    });
  </script>
</body>
</html>
