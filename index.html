<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meta Display Image</title>
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Renders a single 600 x 600 image">
  <meta name="mrbd-web-app-capable" content="yes">
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    body { width: 600px; height: 600px; overflow: hidden; }
    img { display: block; width: 600px; height: 600px; }
  </style>
</head>
<body>
  <img src="box_G255.png" width="600" height="600" alt="">
  <script>
    async function keepAwake() {
      try { await navigator.wakeLock.request('screen'); } catch (e) { /* unsupported or denied */ }
    }
    keepAwake();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepAwake();
    });

    // Left/right (arrow key) input cycles through the images, wrapping at both ends.
    const images = [
      'bigstairs_2_green.png', 
      'bigstairs_4_green.png',
      'square_1x1_G255_2deg_rot0.png',
      'square_3x3_G255_2deg_rot0.png',
      'circle_1x1_W255_R0p75deg.png',
      'circle_3x3_W255_R0p75deg.png',
      'alcm_W_clip.png',
      'alcm_W_inv_clip.png',
      'solid_R255.png',
      'solid_G255.png',
      'solid_B255.png',
      'solid_W255.png',
      'box_R255.png',
      'box_B255.png',
      'box_W255.png',
      'box_G255.png'
    ];
    let i = 0;
    const img = document.querySelector('img');
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') i = (i + 1) % images.length;
      else if (e.key === 'ArrowLeft') i = (i - 1 + images.length) % images.length;
      else return;
      img.src = images[i];
      e.preventDefault();
    });
  </script>
</body>
</html>
